name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true
      - run: go build ./cmd/sandboxer
      # Cross-build the other release target so arch-specific breakage is caught
      # here, not only at release time.
      - name: Cross-build (linux/arm64)
        run: GOOS=linux GOARCH=arm64 go build ./...
      # -race guards the parallel batch runner (the worker pool + failure
      # aggregation); cgo is available on the runner so the detector links.
      - run: go test ./... -race -coverprofile=coverage.out
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 >= 90.0) ? 0 : 1 }' \
            || { echo "::error::total coverage ${total}% is below the 90% gate"; exit 1; }
      - run: go vet ./...
      # The coverage total is printed by the "Coverage summary" step above; we
      # deliberately do NOT upload coverage.out as an artifact. This forge's
      # runner has no Actions artifact storage, so actions/upload-artifact fails
      # and reddens the whole job even when tests and the gate pass. Nothing
      # downstream consumes the profile, so there is nothing to upload.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6

  nix:
    # Dedicated nix lane on the Forgejo runner (rgband/infra forgejo-runner-3):
    # the job image is nixos/nix, so nix is preinstalled — no install step. That
    # image does not enable flakes by default, hence NIX_CONFIG. The runner caps
    # the job container memory, so the build can't freeze the host.
    runs-on: nix
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      # actions/checkout is a Node action; the nixos/nix job image ships no node
      # (and no standard glibc loader), so it cannot run here. Clone manually with
      # the job token instead — git + CA certs are present in the image.
      - name: Checkout (manual — nixos/nix image has no node runtime)
        run: |
          host="${GITHUB_SERVER_URL#https://}"
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: nix flake check --no-build
      - run: nix build .#sandboxer --no-link

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Conventional Commits
        run: |
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          status=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            msg_file="$(mktemp)"
            git log -1 --format=%B "$sha" > "$msg_file"
            if ! bash scripts/git-hooks/commit-msg "$msg_file"; then
              echo "::error::commit $sha has a non-conforming message" >&2
              status=1
            fi
            rm -f "$msg_file"
          done < <(git rev-list --no-merges "$range")
          exit "$status"
