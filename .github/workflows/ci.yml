# CI gate: lint + test (engine-free 90% coverage gate), a real-engine
# integration slice, a vulnerability scan, and a nix flake check.
#
# Triggers on every push to main and every pull request. All jobs run in
# parallel.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Track the toolchain pinned in go.mod (do not hardcode the version).
          go-version-file: go.mod
      # Fail fast if go.sum no longer matches the module graph (a contributor
      # without the pre-commit hook could otherwise drift go.mod/go.sum).
      - run: go mod verify
      # The config layer shells out to nix-instantiate (sandboxer.nix is the
      # config format), so the unit tests need a real nix — eval only, no
      # builds.
      - uses: cachix/install-nix-action@v31
      - run: go build ./...
      # Cross-build the other release target so arch-specific breakage is
      # caught here, not only at release time.
      - run: GOOS=linux GOARCH=arm64 go build ./...
      # -race guards the concurrent session lifecycle (first-enter create races,
      # egress adoption). NOTE: no `-tags integration` — the 90% gate is
      # calibrated engine-free and the integration tests are //go:build integration.
      - run: go test ./... -race -coverprofile=coverage.out
      - run: go tool cover -func=coverage.out | tail -1
      # Coverage gate: fail the build under 90% total coverage.
      - name: coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 >= 90.0) ? 0 : 1 }' \
            || { echo "ERROR: total coverage ${total}% is below the 90% gate" >&2; exit 1; }
      - run: go vet ./...

  # Real-engine integration slice. The full suite needs the toolbox image (a
  # multi-minute nix-in-container build) and runs on the maintainer's Jenkins;
  # this job takes the part that does NOT — the wall, mount and egress
  # guarantees, which need only a small pre-pulled image — so those stop
  # depending on somebody remembering to run them.
  #
  # This exists because they DID rot: an integration test asserting host auth
  # passthrough had been failing for ~8 releases, unnoticed, because nothing in
  # GitHub CI ever compiled or ran `-tags integration`. Everything the toolbox
  # image gates still skips cleanly here.
  itest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The config layer shells out to nix-instantiate, same as the unit tests.
      - uses: cachix/install-nix-action@v31
      # itest.SmokeImage deliberately NEVER pulls (the suite stays offline-safe),
      # so the image has to be here before the tests look for it.
      - run: docker pull alpine:latest
      # Compile the WHOLE suite even though only a slice is run: a build tag
      # nothing ever compiles is where bit-rot starts.
      - run: go vet -tags integration ./...
      - name: integration (engine-level, no toolbox image)
        env:
          SANDBOXER_ITEST_ENGINE: docker
        run: go test -tags integration -count=1 -timeout 20m ./internal/backend/... ./internal/egress/...

  # Reachability-based vulnerability scan. govulncheck reports only what the
  # code actually CALLS, so it stays quiet about the long tail of advisories in
  # required-but-unreached modules and fails when one is genuinely on a path we
  # execute.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # .golangci.yml is golangci-lint v2 config; golangci-lint-action v8
      # supports golangci-lint >= v2.1.0 and accepts a full patch version.
      #
      # The pin must be built with a Go at least as new as go.mod's floor:
      # golangci-lint refuses to run when "the Go language version used to
      # build golangci-lint is lower than the targeted Go version", so raising
      # the floor past 1.24 broke the old v2.1.6 pin (built with go1.24.2).
      # v2.12.2 is built with go1.26 — ahead of the current 1.25.10 floor, with
      # room for the next bump — and is what the nix devShell provides, so a
      # local run and this job agree.
      #
      # skip-cache: the action's restored lint cache makes results
      # NON-DETERMINISTIC. staticcheck's SA5011 needs whole-package facts to
      # know a call does not return (t.Fatal), and a partially-cached run can
      # miss them: the identical tree that linted clean at one commit reported a
      # false "possible nil pointer dereference" at the next, in a test file
      # neither commit touched. A cold run of the same version and toolchain
      # reports nothing. Green-because-cached is worse than slow, and the
      # analysis costs seconds here.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          skip-cache: true

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - run: nix flake check --no-build --print-build-logs
      - run: nix build .#sandboxer --no-link --print-build-logs
      # The toolbox-image flake is an embedded asset built only inside the
      # ephemeral builder container, so `nix flake check` never sees it; parse
      # it here so a syntax error fails CI instead of a user's first build.
      - run: nix-instantiate --parse internal/toolbox/assets/flake.nix > /dev/null
      # The egress proxy image is small (just squid), so actually BUILD it every
      # run — a semantic flake regression in it is then caught in CI, not at a
      # user's first sandbox enter. (The heavy toolbox image is built only on a
      # tag release; see release.yml.)
      - run: nix build .#proxyImage --no-link --print-build-logs
