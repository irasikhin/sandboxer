name: release

on:
  push:
    tags:
      - "v*"

# Single job: build both arches and publish in one go. Passing the archives
# between a build job and a publish job needs upload-/download-artifact, which
# requires the forge's Actions artifact storage — unavailable on our runner, so
# every release build died at the upload step and `publish` never ran. Building
# and publishing in one job removes that dependency entirely.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Verify tag matches nix/package.nix version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg_version=$(grep -oP 'version\s*=\s*"\K[^"]+' nix/package.nix | head -1)
          if [ "$tag" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match nix/package.nix version $pkg_version" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build release archives (linux amd64 + arm64)
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for pair in linux/amd64 linux/arm64; do
            export GOOS="${pair%/*}" GOARCH="${pair#*/}"
            out="sandboxer-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
            go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/${out}/sandboxer" ./cmd/sandboxer
            cp README.md CHANGELOG.md LICENSE "dist/${out}/" 2>/dev/null || true
            tar -czf "dist/${out}.tar.gz" -C dist "${out}"
            (cd dist && sha256sum "${out}.tar.gz" > "${out}.tar.gz.sha256")
            # Smoke-test the host-native (amd64) binary only.
            if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "amd64" ]; then
              "dist/${out}/sandboxer" --version
              "dist/${out}/sandboxer" --help >/dev/null
            fi
            rm -rf "dist/${out}"
          done

      - name: Extract changelog section for this tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v tag="$tag" '
            BEGIN { p = 0 }
            /^## \[/ {
              if (p) exit
              if ($0 ~ "^## \\[" tag "\\]") { p = 1; next }
            }
            p { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "_(no changelog section authored for this release)_" > release-notes.md
          fi

      # Publish via the Forgejo release API directly. softprops/action-gh-release
      # speaks GitHub's API shape and does not work against this Forgejo instance;
      # a couple of curl calls do. node is always present in the job image, so we
      # use it to build/parse JSON without depending on jq.
      - name: Publish release (Forgejo API)
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          body=$(node -e 'process.stdout.write(JSON.stringify({tag_name:process.env.GITHUB_REF_NAME,name:process.env.GITHUB_REF_NAME,body:require("fs").readFileSync("release-notes.md","utf8"),draft:false,prerelease:false}))')
          rid=$(curl -fsS -X POST -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
            --data "${body}" "${api}/releases" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).id))')
          echo "Created release ${GITHUB_REF_NAME} (id ${rid})"
          for f in dist/*.tar.gz dist/*.tar.gz.sha256; do
            echo "  uploading $(basename "$f")"
            curl -fsS -X POST -H "Authorization: token ${TOKEN}" \
              -F "attachment=@${f}" \
              "${api}/releases/${rid}/assets?name=$(basename "$f")" >/dev/null
          done
          echo "Published ${GITHUB_REF_NAME}"
