# A named profile. Drop this under ~/.config/sandboxer/profiles/ (or any
# directory you point at with `-f <dir>`) and use it by name:
#
#   sandboxer create web
#   sandboxer create web -f ./examples/profiles
#
# The profile's name is this file's base name (web) unless an explicit `name:`
# overrides it. The sandbox slug is that name.
name: web
backend: podman
network:
  allowedDomains: [api.anthropic.com, registry.npmjs.org, github.com]

# The sources the sandbox sees ({src: .} = the project repo, whole).
srcs:
  - src: .
