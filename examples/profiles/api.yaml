# A second named profile, for a container backend narrowed to part of the repo.
#
#   sandboxer create api -f ./examples/profiles
#
# `sandboxer profile list -f ./examples/profiles` lists both web and api.
name: api
backend: podman
network:
  allowedDomains: [api.openai.com, registry.npmjs.org, pypi.org]
# srcs narrows the sandbox with gitignore-style include patterns.
srcs:
  - src: .
    include: ["/shared/lib/"]
