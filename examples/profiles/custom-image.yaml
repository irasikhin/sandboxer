# A profile with a customized toolbox image (no nix on your machine — the
# builder container does everything):
#
#   sandboxer image build custom-image -f ./examples/profiles   # build the variant
#   sandboxer create custom-image -f ./examples/profiles        # or just create +
#   sandboxer enter  custom-image                               # enter — auto-builds
#
# The customization is content-addressed: this profile's sandboxes run
# sandboxer-toolbox:var-<12hex> (hashed over the input pins, the package set
# and image.nix's content), built on first use and shared by identical
# profiles. The stock sandboxer-toolbox:latest is untouched.
name: custom-image
network:
  allowedDomains: [api.anthropic.com, github.com]

image:
  # Extra nixpkgs packages baked into the image. Dotted attribute paths are
  # allowed; an unknown attribute aborts the build (never silently dropped).
  extraPkgs: [gh, python3Packages.requests]

  # A nix hook into the image build — the full { packages, files, env,
  # overlay } contract, commented in image.nix. A relative path resolves
  # against this file. The hook runs in the throwaway builder container: same
  # trust level as a `setup:` script (read third-party profiles before running
  # them).
  nix: image.nix

  # Flake-input pin overrides; empty keeps the pins embedded in the binary.
  # "latest" resolves the remote head ONCE at build time and stamps it into
  # the per-user pins cache (~/.cache/sandboxer/image-pins.json); enter/exec
  # reuse the stamp, and only `sandboxer image build --refresh` re-resolves.
  # llmAgentsRev: latest             # newer agents without a sandboxer release
  # nixpkgsRev: 64c08a7ca051951c8eae34e3e3cb1e202fe36786   # or pin exactly
