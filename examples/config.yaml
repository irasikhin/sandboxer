# Minimal sandbox profile.
#
# sandboxer auto-discovers `sandboxer.yaml` in the current directory (or
# pass one explicitly: `sandboxer create --config path/feat.yaml`, or
# positionally `sandboxer create feat.yaml`). This file is a standalone sample of
# the flat single-profile form — copy it to ./sandboxer.yaml to use it.

# Sandbox name (slug). Drives the worktree branch feat/<name>-sb.
name: feature-x

# The sources the sandbox sees — always explicit ({src: .} = this repo, whole;
# relative paths resolve against the project root). See with-srcs.yaml for
# include patterns, extra repos and branch adoption.
srcs:
  - src: .

# Isolation backend — a podman or docker container built from the toolbox image
# (works with any agent). Leave empty to auto-detect (docker, then podman).
backend: podman

# A sandbox is not bound to one agent — run any of them with 'sandboxer exec
# <slug> -- <agent>'. `agents:` (below) picks whose credentials to pass through.
# There is no model: knob either — sandboxer never launches the agent, so pin the
# model via the agent's own env var under env: below (e.g. ANTHROPIC_MODEL).

# Egress allowlist — the ONLY domains the sandbox may reach (enforced by the
# container's egress proxy); everything else is blocked.
#
# NOTE: allowedDomains REPLACES the built-in default list wholesale. The defaults
# already cover the common AI APIs and package registries (npm, pypi, Maven
# Central, crates, Go, RubyGems, github — see DefaultDomains in
# internal/config/defaults.go). If you set allowedDomains you must re-list EVERY
# domain you need — e.g. add repo.maven.apache.org and repo1.maven.org for Maven.
# Omit this block entirely to keep the full defaults.
network:
  allowedDomains: [api.anthropic.com, registry.npmjs.org, github.com, repo.maven.apache.org, repo1.maven.org, central.sonatype.com]
  # proxy: http://localhost:9999        # ONE proxy URL — see the proxy note below
  # noProxy: localhost,127.0.0.1,.corp  # NO_PROXY, direct mode only (egress off)
  # Per-domain routes: send specific domains through their own upstream proxy
  # (e.g. bypass a geo-block for one API). Each routed domain must also be in
  # allowedDomains above; a domain may route to only one proxy; a routed peer
  # being down fails closed (503). Routes need egress on (ignored in direct mode).
  # routes:
  #   - domains: [api.anthropic.com]
  #     proxy: http://bypass-ru:8080

# Sandbox content: a sandbox is a git worktree of THIS repo (the whole repo by
# default). deps narrows that worktree to the listed repo-relative directories
# via cone sparse-checkout — useful in a large monorepo. Editing deps takes
# effect on `sandboxer recreate`. To bring in OTHER trees, use extraMounts below.
# deps:
#   - src/lib
#   - shared/proto

# One-time setup: a shell script (bash -lc) run once inside the sandbox before
# you take over — install deps, build, seed a DB. It runs on the first
# enter/exec and re-runs only when the script changes; it runs under the
# egress allowlist above (so installs need their domains allowed) and is fatal
# on failure (skip with --no-setup).
# setup: |
#   npm ci
#   npm run build

# Tool packs: language/runtime toolchains baked into a per-profile toolbox image
# variant (built on demand, cached by tool-set hash). See registry/tools.json
# for the available packs.
# tools: [node, go]

# Resource caps for the sandbox container (empty = uncapped). memory/cpus
# override the SANDBOXER_MEM/SANDBOXER_CPU env defaults; pids is a --pids-limit
# that bounds fork-bomb blast radius.
# limits:
#   memory: 4G
#   cpus: 2
#   pids: 512

# Which agents' credentials to bind into the container (container backends
# only). Defaults to every agent in the registry; narrow it to avoid mounting
# credentials you don't need.
# agents: [opencode, claude]

# Proxy — ONE URL under network: (network.proxy above); the egress toggle
# (below) decides the trust model: egress on (default) = allowlist stays ON and
# traffic is CHAINED through the proxy (http:// only); egress off = the agent
# talks to the proxy DIRECTLY (http:// or https://; noProxy applies). A
# localhost/127.0.0.1 proxy means a proxy on your HOST (rewritten to the host
# gateway automatically). Per-domain overrides: network.routes above. Env
# default: SANDBOXER_PROXY. Full story: README "Egress allowlist (container
# backend)".

# Container backends force the allowlist proxy by default (agent on an
# --internal network, sole exit via the forward-proxy). Set to false to disable.
# egress: true
