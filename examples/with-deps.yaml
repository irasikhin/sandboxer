# Profile with dependencies, a container backend, and a proxy.
#
# The sandbox content is driven by roots+deps: each dep is located by path
# suffix under the roots, copied INTO the sandbox, and (rw) pushed back to its
# origin with `sandboxer push`. Handy for monorepo vendoring or shared libs.

name: integ

# Container toolbox: image with the agents (nix run .#build-image). Any agent,
# not just claude. (codex is Rust and is not baked into the image due to build
# time; bring your own / BYO image for it.)
backend: podman
agent: opencode
model: gpt-5

# Which agents to authorize in the container (bind their config dirs / env).
# Defaults to every agent in the registry; narrow it to avoid mounting
# credentials you don't need.
agents: [opencode, claude]

network:
  allowedDomains: [api.openai.com, api.anthropic.com, registry.npmjs.org, pypi.org]

# Container egress is forced by the allowlist proxy by default (agent on an
# --internal network, sole exit via the forward-proxy). Disable with:
# egress: false        # or set env SANDBOXER_NO_EGRESS=1

# Corporate proxy, forwarded as HTTP(S)_PROXY / NO_PROXY to both backends.
# proxy: { http: "http://proxy.corp:3128", https: "http://proxy.corp:3128", no: "localhost,127.0.0.1,.corp" }

# Search roots and the deps to find under them (matched by path suffix, copied
# flat to <sandbox>/<dep>; rw entries are pushed back on `sandboxer push`).
roots:
  - /home/me/work/app
  - /home/me/work
deps:
  - shared-lib          # any dir/file named shared-lib
  - src/proto           # any path ending with src/proto

# Extra bind mounts and env for the container (optional).
# extraMounts:
#   - { source: /data/cache, target: /data/cache, mode: rw }
# env:
#   NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
