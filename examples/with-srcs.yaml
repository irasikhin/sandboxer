# Profile that narrows the sandbox to a subset of the repo, with a container
# backend and a custom agent set.
#
# A sandbox exposes SOURCES: each srcs entry is a git repo checked out into a
# host-side worktree; ONLY the files its gitignore-style include patterns
# select are visible inside the container — git itself never is. Work returns
# as an ordinary branch (feat/<name>-sb) you review and commit on the HOST;
# there is no copy-in and no push-back.

name: integ

# Container toolbox: image with the agents (nix run .#build-image). Any agent,
# not just claude. (codex is Rust and is not baked into the image due to build
# time; bring your own / BYO image for it.)
backend: podman

# Which agents' credentials to pass through to the container. Defaults to every
# agent in the registry; narrow it to avoid passing creds you don't need. Run
# any of them with 'sandboxer exec integ -- <agent>'.
agents: [opencode, claude]

network:
  allowedDomains: [api.openai.com, api.anthropic.com, registry.npmjs.org, pypi.org, repo.maven.apache.org, repo1.maven.org, central.sonatype.com]

# Container egress is forced by the allowlist proxy by default (agent on an
# --internal network, sole exit via the forward-proxy). Disable with:
# egress: false        # or set env SANDBOXER_NO_EGRESS=1

# Proxy — ONE URL under network: (network.proxy); the egress toggle above
# decides the mode — see examples/config.yaml and README "Egress allowlist
# (container backend)".

# Srcs: the repos (and slices of them) the sandbox sees. src is a path to a
# repo root, include narrows it with gitignore-style patterns (omit include for
# the whole repo; branch: adopts an existing branch/worktree). Omit srcs
# entirely for [{src: .}] — this repo, whole.
srcs:
  - src: .
    include:
      - /src/proto/
      - /shared/lib/
  # - src: ../other-repo               # a second repo, whole
  # - src: ../protolib
  #   branch: feat/proto-v2            # adopt an existing branch/worktree

# Extra bind mounts and env for the container (optional). extraMounts is the way
# to bring in OTHER (non-git) trees:
# extraMounts:
#   - { source: /data/cache, target: /data/cache, mode: rw }
# env:
#   NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
#
# Persist Maven's local repo across runs: the sandbox $HOME is ephemeral, so the
# default ~/.m2 is thrown away each run. Bind the host ~/.m2 at a fixed path and
# point Maven at it (Maven Central is already in the default allowlist; mode rw
# lets Maven download-on-miss into the real host cache):
# extraMounts:
#   - { source: /home/me/.m2, target: /cache/.m2, mode: rw }
# env:
#   MAVEN_OPTS: "-Dmaven.repo.local=/cache/.m2/repository"
