# Woodpecker port of the `nix` job in .github/workflows/ci.yml.
#
# The original job ran on `runs-on: nix` (act_runner runner-3, rgband/infra
# forgejo-runner-3 — that lane is parked at replicas:0, so this job was dead).
# This pipeline replaces it on Woodpecker.
#
# All flake inputs are public (nixpkgs/flake-utils/llm-agents via github.com),
# so no SSH keys or netrc are needed — the container can fetch them over HTTPS.
#
# Two steps mirror the original two `run:` lines, run sequentially (depends_on)
# so at most one nixos/nix container is live at a time.
when:
  - event: [push, pull_request, manual]

steps:
  flake-check:
    image: nixos/nix:2.28.3
    commands:
      - mkdir -p /etc/nix
      - echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
      - nix flake check --no-build --print-build-logs

  nix-build:
    image: nixos/nix:2.28.3
    depends_on: [flake-check]
    commands:
      - mkdir -p /etc/nix
      - echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
      - nix build .#sandboxer --no-link --print-build-logs
